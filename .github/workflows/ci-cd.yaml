name: Multi-job CI/CD for Back and Front

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        component: [back, front]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sfeir-${{ matrix.component }}:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sfeir-${{ matrix.component }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.component }}-v1.0.0-${{ steps.vars.outputs.sha_short }}
          name: Release ${{ matrix.component }} - ${{ steps.vars.outputs.sha_short }}
          body: |
            Automated Release for ${{ matrix.component }}
            Docker Image: ${{ secrets.DOCKERHUB_USERNAME }}/sfeir-${{ matrix.component }}:${{ steps.vars.outputs.sha_short }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: self-hosted
    needs: build-and-test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Short SHA (for tag matching)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy Stack to Docker Swarm
        run: |
          # On exporte les variables que le fichier docker-compose va lire
          export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          export IMAGE_TAG="${{ steps.vars.outputs.sha_short }}"
          
          # Commande de déploiement pour Docker Swarm (déploiement local ou via runner)
          docker stack deploy -c docker-compose.yaml final-pipeline
